<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eaglercraft Client Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      margin: 0;
      padding: 2rem 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 0.5rem 0; color: #4ade80; }
    p.subtitle { margin: 0 0 1.5rem 0; color: #a3a3a3; }
    #search {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      margin-bottom: 1.5rem;
      outline: none;
    }
    #search:focus { border-color: #4ade80; }
    #status { color: #a3a3a3; margin-bottom: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
    }
    a.card {
      display: block;
      padding: 1rem;
      background-color: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #f0f0f0;
      text-decoration: none;
      font-weight: 500;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.card:hover { border-color: #4ade80; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Eaglercraft Launcher</h1>
    <p class="subtitle">Select any client below to launch it in your browser.</p>
    <input type="text" id="search" placeholder="Search clients (e.g., 1.8, 1.12, WASM, Astra)..." />
    <div id="status">Loading client list...</div>
    <div id="client-grid" class="grid"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('client-grid');
    const searchEl = document.getElementById('search');
    let allClients = [];

    async function loadClients() {
      try {
        const res = await fetch('https://github.com');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allClients = data.tree
          .filter(item => item.type === 'blob' && item.path.endsWith('.html') && item.path.toLowerCase() !== 'index.html')
          .map(item => item.path)
          .sort((a, b) => a.localeCompare(b));

        renderClients(allClients);
      } catch (err) {
        statusEl.textContent = `Error loading clients: ${err.message}`;
      }
    }

    function renderClients(list) {
      gridEl.innerHTML = '';
      statusEl.textContent = `Showing ${list.length} client${list.length === 1 ? '' : 's'}`;

      list.forEach(filename => {
        const link = document.createElement('a');
        link.className = 'card';
        link.href = encodeURIComponent(filename);
        link.textContent = filename.replace(/\.html$/i, '');
        gridEl.appendChild(link);
      });
    }

    searchEl.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allClients.filter(name => name.toLowerCase().includes(term));
      renderClients(filtered);
    });

    loadClients();
  </script>
</body>
</html>
